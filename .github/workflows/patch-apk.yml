name: Patch Big Bash APK

on:
  workflow_dispatch:
    inputs:
      drive_link:
        description: 'Google Drive APK Download Link'
        required: true
        default: 'https://drive.google.com/file/d/1bSA7WcWnQ1H-uiJzng2cdB5-ntY-s9Xh/view?usp=drivesdk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip wget
          pip install gdown requests

      - name: Download APK from Google Drive
        run: |
          python3 -c "
          import gdown
          url = '${{ github.event.inputs.drive_link }}'
          # Convert share link to direct download link
          file_id = url.split('/d/')[1].split('/')[0]
          output = 'game.apk'
          gdown.download(f'https://drive.path/uc?id={file_id}', output, quiet=False)
          "

      - name: Extract and Process APK (Apktool)
        run: |
          # Tool download karenge apk decompile/compile ke liye
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          chmod +x apktool apktool.jar
          sudo mv apktool apktool.jar /usr/local/bin/

          # Decompile APK
          apktool d game.apk -o decompiled_game

      - name: Run Python Script for Modifying Squad / Metadata Limits
        run: |
          python3 -c "
          import os

          print('Scanning and patching files...')
          # Yahan hum libil2cpp ya metadata ko target kar sakte hain
          # Yahan aap apni custom python logic likh sakte hain jo squad limit 18 se 12 kare
          metadata_path = 'decompiled_game/assets/bin/Data/Managed/Metadata/global-metadata.dat'
          if os.path.exists(metadata_path):
              print('global-metadata.dat found!')
              # Binary patching logic yahan add hogi agar zaroori hui
          else:
              print('Metadata path needs verification.')
          "

      - name: Rebuild and Sign APK
        run: |
          apktool b decompiled_game -o modified.apk
          
          # Generate debug keystore for signing
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android
          
          # Sign APK using uber-apk-signer ya jarsigner
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
          java -jar signer.jar --apks modified.apk --out ./final_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched-BigBash-APK
          path: ./final_output/*.apk
