name: extract-both-files
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gdown

      - name: Download & Raw Binary Patch & Extract
        run: |
          mkdir -p input out
          gdown 1MGxpvepAchNFCzeqj8dFCZDAVclHJm38 -O input/original.obb
          gdown 1bVYc8GTYKo8wzFkh9vXqQyAuDDnFil3Y -O input/HUR_1.txt
          gdown 10TzP0U8tFzpCUR5NIilzAz90E_ZsckPe -O input/BBL_Bios_1.txt

          python -c '
          import zipfile, os

          obb_path = "input/original.obb"
          hur_path = "input/HUR_1.txt"
          bios_path = "input/BBL_Bios_1.txt"

          HUR_HASH = "182e001bae56bcb419267264cf896a7d"
          BIOS_HASH = "301e2e6076b6de344a21203af8dac419"

          with open(hur_path, "rb") as f:
              new_hur = f.read().strip()
          with open(bios_path, "rb") as f:
              new_bios = f.read().strip()

          def raw_replace(orig_bytes, new_payload):
              start_idx = orig_bytes.find(b"{\"")
              if start_idx == -1:
                  start_idx = orig_bytes.find(b"{")
              if start_idx == -1:
                  return orig_bytes
              header = orig_bytes[:start_idx]
              orig_len = len(orig_bytes) - start_idx
              if len(new_payload) > orig_len:
                  new_payload = new_payload[:orig_len]
              padded = new_payload + (b" " * (orig_len - len(new_payload)))
              return header + padded

          with zipfile.ZipFile(obb_path, "r") as zin:
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  if HUR_HASH in item.filename or HUR_HASH.encode("utf-8") in data:
                      patched = raw_replace(data, new_hur)
                      with open(os.path.join("out", HUR_HASH), "wb") as f:
                          f.write(patched)
                      print("Patched HUR raw file successfully!")
                  elif BIOS_HASH in item.filename or BIOS_HASH.encode("utf-8") in data:
                      patched = raw_replace(data, new_bios)
                      with open(os.path.join("out", BIOS_HASH), "wb") as f:
                          f.write(patched)
                      print("Patched BIOS raw file successfully!")
          '

      - uses: actions/upload-artifact@v4
        with:
          name: both-patched-container-files
          path: |
            out/182e001bae56bcb419267264cf896a7d
            out/301e2e6076b6de344a21203af8dac419
            
