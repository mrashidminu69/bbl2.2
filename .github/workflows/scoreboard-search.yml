name: Find Match Scoreboard

on:
  workflow_dispatch:

jobs:
  find-scoreboard:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. INSTALL TOOLS
      # ==========================================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget grep jq


      # ==========================================
      # 3. DOWNLOAD ORIGINAL APK
      # ==========================================
      - name: Download original APK
        run: |
          set -e

          wget -O original.apk \
            "https://drive.usercontent.google.com/download?id=1jnefeyVzWWbci0Dx68tsQJtLHK9qHxZH&confirm=t"

          echo "=== APK ==="
          ls -lh original.apk

          test -s original.apk


      # ==========================================
      # 4. EXTRACT IL2CPP FILES
      # ==========================================
      - name: Extract IL2CPP files
        run: |
          set -e

          mkdir -p game

          unzip -j original.apk \
            "lib/arm64-v8a/libil2cpp.so" \
            "assets/bin/Data/Managed/Metadata/global-metadata.dat" \
            -d game

          echo "=== EXTRACTED FILES ==="
          ls -lh game/

          test -f game/libil2cpp.so
          test -f game/global-metadata.dat


      # ==========================================
      # 5. DOWNLOAD IL2CPPDUMPER
      # ==========================================
      - name: Download Il2CppDumper
        run: |
          set -e

          API="https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest"

          echo "Getting latest Il2CppDumper release..."

          wget -qO release.json "$API"

          echo "=== RELEASE ==="
          jq -r '.tag_name' release.json

          echo "=== AVAILABLE ASSETS ==="
          jq -r '.assets[].name' release.json

          mkdir -p Il2CppDumper

          # Find a Linux archive automatically.
          ASSET_URL=$(jq -r '
            .assets[]
            | select(
                (.name | ascii_downcase | contains("linux"))
                and
                (
                  (.name | endswith(".zip"))
                  or
                  (.name | endswith(".tar.gz"))
                )
              )
            | .browser_download_url
          ' release.json | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo ""
            echo "ERROR: Linux Il2CppDumper asset was not found."
            echo ""
            echo "Available assets:"
            jq -r '.assets[] | .name + " -> " + .browser_download_url' release.json
            exit 1
          fi

          echo ""
          echo "Selected asset:"
          echo "$ASSET_URL"
          echo ""

          wget -O dumper-package "$ASSET_URL"

          echo "=== DOWNLOADED PACKAGE ==="
          file dumper-package
          ls -lh dumper-package


      # ==========================================
      # 6. EXTRACT IL2CPPDUMPER
      # ==========================================
      - name: Extract Il2CppDumper
        run: |
          set -e

          mkdir -p Il2CppDumper

          if file dumper-package | grep -qi "Zip archive"; then

            echo "ZIP package detected."

            unzip -q dumper-package \
              -d Il2CppDumper

          elif file dumper-package | grep -qi "gzip compressed"; then

            echo "GZIP package detected."

            tar -xzf dumper-package \
              -C Il2CppDumper

          else

            echo "Unknown package format:"
            file dumper-package

            exit 1

          fi

          echo "=== DUMPER CONTENT ==="
          find Il2CppDumper -maxdepth 3 -type f -print


      # ==========================================
      # 7. FIND DUMPER EXECUTABLE
      # ==========================================
      - name: Locate Il2CppDumper executable
        run: |
          set -e

          DUMPER=$(find Il2CppDumper \
            -type f \
            \( -name "Il2CppDumper" -o -name "Il2CppDumper.exe" \) \
            | head -n 1)

          if [ -z "$DUMPER" ]; then
            echo "ERROR: Il2CppDumper executable not found."

            echo "Files found:"
            find Il2CppDumper -type f

            exit 1
          fi

          echo "DUMPER=$DUMPER" >> "$GITHUB_ENV"

          chmod +x "$DUMPER" || true

          echo "Using:"
          echo "$DUMPER"


      # ==========================================
      # 8. GENERATE DUMP
      # ==========================================
      - name: Generate dump.cs
        run: |
          set -e

          mkdir -p dumpout

          echo "Running Il2CppDumper..."

          "$DUMPER" \
            game/libil2cpp.so \
            game/global-metadata.dat \
            dumpout

          echo ""
          echo "=== DUMP OUTPUT ==="
          find dumpout -maxdepth 2 -type f -ls

          if [ ! -f dumpout/dump.cs ]; then
            echo ""
            echo "ERROR: dump.cs was not generated."

            echo ""
            echo "Dumper output:"
            find dumpout -type f -print

            exit 1
          fi


      # ==========================================
      # 9. SEARCH SCOREBOARD
      # ==========================================
      - name: Search scoreboard
        run: |
          set -e

          echo "========================================" > scoreboard-search.txt
          echo "       MATCH SCOREBOARD SEARCH" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt


          echo "========================================" >> scoreboard-search.txt
          echo "1. SCOREBOARD / HUD KEYWORDS" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt

          grep -Ein \
            "ScoreBoard|Scoreboard|Score|HUD|MatchUI|GameUI|MatchScore|ScoreUI|ScorePanel|ScoreText|Runs|Wickets|Overs|Batting|Bowling|Innings|Canvas|TextMeshPro|TMP_Text" \
            dumpout/dump.cs \
            >> scoreboard-search.txt || true


          echo "" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "2. POSSIBLE UI CLASSES" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt

          grep -Ein \
            "class .*UI|class .*Ui|class .*Hud|class .*HUD|class .*Score|class .*Match|class .*Canvas|class .*Panel" \
            dumpout/dump.cs \
            >> scoreboard-search.txt || true


          echo "" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "3. SCORE METHODS" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt

          grep -Ein \
            "SetScore|UpdateScore|UpdateRuns|SetRuns|UpdateWicket|SetWicket|UpdateOvers|SetOvers|UpdateScoreboard|SetScoreboard|RefreshScore|RefreshUI|UpdateUI" \
            dumpout/dump.cs \
            >> scoreboard-search.txt || true


          echo "" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "4. SCORE / WICKET / OVER REFERENCES" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt

          grep -Ein \
            "run|runs|wicket|wickets|over|overs|score|scoreboard" \
            dumpout/dump.cs \
            >> scoreboard-search.txt || true


          echo "" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "SEARCH COMPLETE" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt


      # ==========================================
      # 10. SHOW RESULT
      # ==========================================
      - name: Show scoreboard result
        run: |
          echo "========================================"
          echo "       SCOREBOARD SEARCH RESULT"
          echo "========================================"

          cat scoreboard-search.txt


      # ==========================================
      # 11. UPLOAD RESULTS
      # ==========================================
      - name: Upload scoreboard results
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-search
          path: |
            scoreboard-search.txt
            dumpout/dump.cs
