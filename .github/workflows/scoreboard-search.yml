name: Find Match Scoreboard

on:
  workflow_dispatch:

jobs:
  find-scoreboard:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. INSTALL BASIC TOOLS
      # ==========================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip wget grep jq file


      # ==========================================
      # 3. INSTALL .NET 6
      # ==========================================
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'


      # ==========================================
      # 4. DOWNLOAD ORIGINAL APK
      # ==========================================
      - name: Download original APK
        run: |
          set -e

          wget -O original.apk \
            "https://drive.usercontent.google.com/download?id=1jnefeyVzWWbci0Dx68tsQJtLHK9qHxZH&confirm=t"

          echo "=== APK INFO ==="
          ls -lh original.apk

          test -s original.apk


      # ==========================================
      # 5. EXTRACT IL2CPP FILES
      # ==========================================
      - name: Extract IL2CPP files
        run: |
          set -e

          mkdir -p game

          unzip -j original.apk \
            "lib/arm64-v8a/libil2cpp.so" \
            "assets/bin/Data/Managed/Metadata/global-metadata.dat" \
            -d game

          echo ""
          echo "=== EXTRACTED IL2CPP FILES ==="
          ls -lh game/

          test -f game/libil2cpp.so
          test -f game/global-metadata.dat


      # ==========================================
      # 6. DOWNLOAD IL2CPPDUMPER .NET 6
      # ==========================================
      - name: Download Il2CppDumper
        run: |
          set -e

          VERSION="v6.7.46"

          URL="https://github.com/Perfare/Il2CppDumper/releases/download/${VERSION}/Il2CppDumper-net6-v6.7.46.zip"

          echo "Downloading:"
          echo "$URL"

          wget -O Il2CppDumper.zip "$URL"

          echo ""
          echo "=== DOWNLOADED DUMPER ==="
          ls -lh Il2CppDumper.zip

          test -s Il2CppDumper.zip


      # ==========================================
      # 7. EXTRACT IL2CPPDUMPER
      # ==========================================
      - name: Extract Il2CppDumper
        run: |
          set -e

          mkdir -p Il2CppDumper

          unzip -q Il2CppDumper.zip \
            -d Il2CppDumper

          echo ""
          echo "=== IL2CPPDUMPER FILES ==="
          find Il2CppDumper -maxdepth 3 -type f -print


      # ==========================================
      # 8. FIND IL2CPPDUMPER DLL
      # ==========================================
      - name: Locate Il2CppDumper DLL
        run: |
          set -e

          DUMPER_DLL=$(find Il2CppDumper \
            -type f \
            -iname "Il2CppDumper.dll" \
            | head -n 1)

          if [ -z "$DUMPER_DLL" ]; then
            echo ""
            echo "ERROR: Il2CppDumper.dll not found."

            echo ""
            echo "Files inside package:"
            find Il2CppDumper -type f -print

            exit 1
          fi

          echo "DUMPER_DLL=$DUMPER_DLL" >> "$GITHUB_ENV"

          echo ""
          echo "Using Il2CppDumper:"
          echo "$DUMPER_DLL"


      # ==========================================
      # 9. GENERATE DUMP.CS
      # ==========================================
      - name: Generate dump.cs
        run: |
          set -e

          mkdir -p dumpout

          echo "========================================"
          echo "       RUNNING IL2CPPDUMPER"
          echo "========================================"

          dotnet "$DUMPER_DLL" \
            game/libil2cpp.so \
            game/global-metadata.dat \
            dumpout

          echo ""
          echo "========================================"
          echo "       DUMP OUTPUT"
          echo "========================================"

          find dumpout -maxdepth 2 -type f -ls

          if [ ! -f dumpout/dump.cs ]; then
            echo ""
            echo "ERROR: dump.cs was not generated."

            echo ""
            echo "Dump directory:"
            find dumpout -type f -print

            exit 1
          fi

          echo ""
          echo "SUCCESS: dump.cs generated."


      # ==========================================
      # 10. SEARCH SCOREBOARD
      # ==========================================
      - name: Search scoreboard
        run: |
          set -e

          echo "========================================" > scoreboard-search.txt
          echo "       MATCH SCOREBOARD SEARCH" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt


          echo "========================================" >> scoreboard-search.txt
          echo "1. SCOREBOARD / HUD KEYWORDS" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt

          grep -Ein \
            "ScoreBoard|Scoreboard|Score|HUD|MatchUI|GameUI|MatchScore|ScoreUI|ScorePanel|ScoreText|Runs|Wickets|Overs|Batting|Bowling|Innings|Canvas|TextMeshPro|TMP_Text" \
            dumpout/dump.cs \
            >> scoreboard-search.txt || true


          echo "" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "2. POSSIBLE UI CLASSES" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt

          grep -Ein \
            "class .*UI|class .*Ui|class .*Hud|class .*HUD|class .*Score|class .*Match|class .*Canvas|class .*Panel" \
            dumpout/dump.cs \
            >> scoreboard-search.txt || true


          echo "" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "3. SCORE METHODS" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt

          grep -Ein \
            "SetScore|UpdateScore|UpdateRuns|SetRuns|UpdateWicket|SetWicket|UpdateOvers|SetOvers|UpdateScoreboard|SetScoreboard|RefreshScore|RefreshUI|UpdateUI" \
            dumpout/dump.cs \
            >> scoreboard-search.txt || true


          echo "" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "4. SCORE / WICKET / OVER REFERENCES" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt

          grep -Ein \
            "run|runs|wicket|wickets|over|overs|score|scoreboard" \
            dumpout/dump.cs \
            >> scoreboard-search.txt || true


          echo "" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "5. UI TEXT / CANVAS REFERENCES" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "" >> scoreboard-search.txt

          grep -Ein \
            "TextMeshPro|TMP_Text|Text|Canvas|RectTransform|GameObject|Image|RawImage|Slider" \
            dumpout/dump.cs \
            >> scoreboard-search.txt || true


          echo "" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt
          echo "SEARCH COMPLETE" >> scoreboard-search.txt
          echo "========================================" >> scoreboard-search.txt


      # ==========================================
      # 11. SHOW RESULT
      # ==========================================
      - name: Show scoreboard result
        run: |
          echo "========================================"
          echo "       SCOREBOARD SEARCH RESULT"
          echo "========================================"

          cat scoreboard-search.txt


      # ==========================================
      # 12. UPLOAD RESULTS
      # ==========================================
      - name: Upload scoreboard results
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-search
          path: |
            scoreboard-search.txt
            dumpout/dump.cs
