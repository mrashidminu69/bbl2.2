name: pack-single-asset
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gdown

      - name: Download Files
        run: |
          mkdir input out
          # Drive se HUR_1.txt download karna
          gdown 1bVYc8GTYKo8wzFkh9vXqQyAuDDnFil3Y -O input/HUR_1.txt
          # Agar aapne original asset file Drive par daal di hai, to uska ID yahan lagayein:
          # gdown YOUR_ORIGINAL_ASSET_DRIVE_ID -O input/182e001bae56bcb419267264cf896a7d

      - name: Pack Asset
        run: |
          python pack_asset.py input/HUR_1.txt input/HUR_1.txt out/182e001bae56bcb419267264cf896a7d

      - uses: actions/upload-artifact@v4
        with:
          name: packed-asset-file
          path: out/182e001bae56bcb419267264cf896a7d
          
